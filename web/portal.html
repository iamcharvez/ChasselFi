<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07110e">
  <title>Connect · ChasselFi</title>
  <link rel="stylesheet" href="/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="portal-body" data-bs-theme="dark">
  <main class="portal-shell container">
    <header class="portal-brand"><span class="brand-mark">C</span><strong id="portal-shop">ChasselFi</strong><span class="secure-chip">● READY</span></header>
    <section class="portal-hero">
      <span class="eyebrow">FAST • FAIR • LOCAL</span>
      <h1>Your WiFi.<br><em>Your time.</em></h1>
      <p id="portal-message">Fast, fair internet for everyone.</p>
    </section>
    <section class="portal-card">
      <div class="portal-status"><span class="pulse-dot"></span><div><small>YOUR STATUS</small><strong>Checking this device…</strong></div><span id="portal-clock">--:--</span></div>
      <div class="portal-tabs nav nav-pills nav-fill" role="tablist">
        <button class="nav-link active" data-portal-tab="status">My time</button>
        <button class="nav-link" data-portal-tab="coin">Insert coin</button>
        <button class="nav-link" data-portal-tab="voucher">Voucher</button>
      </div>
      <div id="portal-panel"></div>
    </section>
    <p class="portal-help">Need help? Ask the WiFi operator. Your device: <span id="device-id">detecting…</span></p>
  </main>
  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/portal.js?v=2" defer></script>
</body>
</html>
