# ChasselFi Nginx edge proxy.
# Install as /etc/nginx/conf.d/chasselfi.conf, then run nginx -t && systemctl reload nginx.
# Keep ChasselFi bound to 127.0.0.1:8080 when using this proxy.

limit_req_zone $binary_remote_addr zone=chasselfi_login:10m rate=10r/m;

# The customer VLAN gateway must not expose the administrator console. The
# admin console remains available on every other local address, including the
# WAN address. The map uses the address Nginx accepted the request on, so no
# WAN address needs to be hard-coded here.
map $server_addr $chasselfi_admin_allowed {
    default 1;
    10.0.0.1 0;
}

map $server_addr $chasselfi_landing {
    default /admin/;
    10.0.0.1 /portal.html;
}

upstream chasselfi_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 4m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        return 302 $chasselfi_landing;
    }

    location = /index.html {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        proxy_pass http://chasselfi_app;
    }

    location = /app.js {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        proxy_pass http://chasselfi_app;
    }

    location ^~ /admin/ {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        proxy_pass http://chasselfi_app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/login {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        limit_req zone=chasselfi_login burst=5 nodelay;
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public customer-portal endpoints available on VLAN 799.
    location = /portal/fas { proxy_pass http://chasselfi_app; }
    location = /portal.html { proxy_pass http://chasselfi_app; }
    location = /portal.js { proxy_pass http://chasselfi_app; }
    location = /styles.css { proxy_pass http://chasselfi_app; }
    location ^~ /vendor/ { proxy_pass http://chasselfi_app; }
    location = /api/rates { proxy_pass http://chasselfi_app; }
    location = /api/settings { proxy_pass http://chasselfi_app; }
    location = /api/vouchers/redeem {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/portal/purchase {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/portal/coin/status {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/portal/coin/cancel {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/portal/status {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/session/heartbeat {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ^~ /api/ {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# Private hardware API for ESP32, Arduino Ethernet/Wi-Fi, Orange Pi, and
# similar coin nodes on VLAN 799. openNDS permits this local port before login,
# but these nodes receive no internet bypass. Every request also requires the
# shared node key and is checked again by ChasselFi against 10.0.0.0/20.
server {
    # Bind before the VLAN is created; source ACL and backend subnet checks
    # still restrict this listener to VLAN 799 nodes.
    listen 2081;
    server_name _;
    server_tokens off;
    client_max_body_size 8k;

    allow 10.0.0.0/20;
    deny all;

    location = /api/coin-node/status {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/coin-node/heartbeat {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/coin-node/pulse {
        proxy_pass http://chasselfi_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }
}

# Local Forwarding Authentication Service. openNDS reserves port 80 for
# captive-portal detection, so the branded ChasselFi FAS is served on 2080.
# This listener contains no administrator routes.
server {
    listen 2080;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /portal/fas {
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /styles.css { proxy_pass http://chasselfi_app; }
    location ^~ /vendor/ { proxy_pass http://chasselfi_app; }
    location / { return 404; }
}

# HTTPS production variant:
# - add `listen 443 ssl http2;`
# - configure ssl_certificate and ssl_certificate_key
# - redirect port 80 to https
# - set CHASSELFI_SECURE_COOKIES=1
