# ChasselFi Nginx edge proxy.
# Install as /etc/nginx/conf.d/chasselfi.conf, then run nginx -t && systemctl reload nginx.
# Keep ChasselFi bound to 127.0.0.1:8080 when using this proxy.

limit_req_zone $binary_remote_addr zone=chasselfi_login:10m rate=10r/m;

upstream chasselfi_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 4m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/login {
        limit_req zone=chasselfi_login burst=5 nodelay;
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# HTTPS production variant:
# - add `listen 443 ssl http2;`
# - configure ssl_certificate and ssl_certificate_key
# - redirect port 80 to https
# - set CHASSELFI_SECURE_COOKIES=1
