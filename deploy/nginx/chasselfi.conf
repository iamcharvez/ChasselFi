# ChasselFi Nginx edge proxy.
# Install as /etc/nginx/conf.d/chasselfi.conf, then run nginx -t && systemctl reload nginx.
# Keep ChasselFi bound to 127.0.0.1:8080 when using this proxy.

limit_req_zone $binary_remote_addr zone=chasselfi_login:10m rate=10r/m;

# The customer VLAN gateway must not expose the administrator console. The
# admin console remains available on every other local address, including the
# WAN address. The map uses the address Nginx accepted the request on, so no
# WAN address needs to be hard-coded here.
map $server_addr $chasselfi_admin_allowed {
    default 1;
    10.0.0.1 0;
}

upstream chasselfi_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 4m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/login {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        limit_req zone=chasselfi_login burst=5 nodelay;
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public customer-portal endpoints available on VLAN 799.
    location = /portal/fas { proxy_pass http://chasselfi_app; }
    location = /portal.html { proxy_pass http://chasselfi_app; }
    location = /portal.js { proxy_pass http://chasselfi_app; }
    location = /styles.css { proxy_pass http://chasselfi_app; }
    location ^~ /vendor/ { proxy_pass http://chasselfi_app; }
    location = /api/rates { proxy_pass http://chasselfi_app; }
    location = /api/settings { proxy_pass http://chasselfi_app; }
    location = /api/vouchers/redeem { proxy_pass http://chasselfi_app; }
    location = /api/portal/purchase { proxy_pass http://chasselfi_app; }
    location = /api/session/heartbeat { proxy_pass http://chasselfi_app; }

    location / {
        if ($chasselfi_admin_allowed = 0) { return 404; }
        proxy_pass http://chasselfi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# HTTPS production variant:
# - add `listen 443 ssl http2;`
# - configure ssl_certificate and ssl_certificate_key
# - redirect port 80 to https
# - set CHASSELFI_SECURE_COOKIES=1
