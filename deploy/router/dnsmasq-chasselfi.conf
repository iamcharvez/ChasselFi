# Replace chasselfi-lan with the real USB-to-LAN interface or bridge.
interface=chasselfi-lan
bind-interfaces
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
server=8.8.8.8

dhcp-range=10.0.0.10,10.15.250,255.255.240.0,12h
dhcp-option=3,10.0.0.1
dhcp-option=6,10.0.0.1
dhcp-authoritative

# Captive portal DNS interception should be implemented deliberately for the
# target portal design; do not wildcard all DNS until allow-lists are tested.
log-dhcp
